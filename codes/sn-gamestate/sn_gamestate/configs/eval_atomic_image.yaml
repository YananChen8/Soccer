# Atomic image-space tracking eval.
# Reports HOTA submetrics DetA and AssA with all GSR attributes disabled.
#
# Usage:
#   python -m tracklab.main -cn eval_atomic_image state.load_file=/path/to/sn-gamestate.pklz
defaults:
  - dataset: soccernet_gs
  - eval: gs_hota
  - engine: offline
  - state: load
  - visualization: no_vis
  - _self_

pipeline: []

experiment_name: "gsr"
experiment_subname: "eval_atomic_image"
home_dir: "${oc.env:HOME}"
data_dir: "${project_dir}/datasets"
model_dir: "${project_dir}/pretrained_models"
num_cores: 16
use_wandb: False
use_rich: True

test_tracking: True
eval_tracking: True
print_config: False

dataset:
  nvid: -1
  eval_set: "valid"
  dataset_path: ${data_dir}/SoccerNetGS
  vids_dict:
    valid: ["SNGS-021", "SNGS-023", "SNGS-034", "SNGS-040", "SNGS-041", "SNGS-051", "SNGS-052", "SNGS-085", "SNGS-091", "SNGS-093"]
  track_eval:
    EVAL_SPACE: "image"
    USE_ROLES: False
    USE_TEAMS: False
    USE_JERSEY_NUMBERS: False

eval:
  cfg:
    bbox_column_for_eval: "bbox_ltwh"
    metrics:
      - "HOTA"
    eval:
      USE_PARALLEL: True
      NUM_PARALLEL_CORES: ${num_cores}
      BREAK_ON_ERROR: False
      PRINT_RESULTS: True
      PRINT_ONLY_COMBINED: True
      PRINT_CONFIG: False
      TIME_PROGRESS: False
      DISPLAY_LESS_PROGRESS: False
      OUTPUT_SUMMARY: True
      OUTPUT_EMPTY_CLASSES: False
      OUTPUT_DETAILED: True
      PLOT_CURVES: True

state:
  save_file: null
  compression: 0
  load_file: "???"

project_dir: "${hydra:runtime.cwd}"
hydra:
  output_subdir: "configs"
  job:
    chdir: True
  run:
    dir: "outputs/${experiment_name}/${experiment_subname}"
  sweep:
    dir: "multirun_outputs/${experiment_name}/${experiment_subname}"
