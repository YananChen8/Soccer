# Step 3 — SAM3 concept detections/tracks, ACCELERATED downstream modules.
# Key changes vs original:
#   - jersey_and_role: frame_stride=5 (Qwen JN on 1/5 of frames only)
#   - jersey_and_role: skip_role_inference=true (use PRTReId role, skip Qwen role pass)
#   - jersey_and_role: batch_size 8→16
#   - legibility:      batch_size 16→64
#   - reid:            batch_size 16→32
defaults:
  - dataset: soccernet_gs
  - eval: gs_hota
  - engine: offline
  - state: save
  - visualization: gamestate
  - modules/bbox_detector: yolov8_person
  - modules/reid: prtreid
  - modules/track: bpbreid_strong_sort
  - modules/legibility: legibility
  - modules/jersey_and_role: qwen2_5vl_jn_and_role_batch
  - modules/team: kmeans_embeddings
  - modules/team_side: mean_position
  - modules/tracklet_agg: voting_role_jn_filter
  - modules/pitch: nbjw_calib
  - modules/calibration: nbjw_calib_decoupled
  - modules/apply_camera_params: nbjw_calib_apply_params
  - modules/concat_tracklets_by_jn: concat_tracklets_by_jn
  - modules/concat_tracklets_by_reid: concat_tracklets_by_reid
  - modules/remove_outside: remove_outside
  - _self_

pipeline:
  - reid
  - pitch
  - calibration
  - apply_camera_params
  - legibility
  - jersey_and_role
  - remove_outside
  - tracklet_agg
  - concat_tracklets_by_jn
  - concat_tracklets_by_reid
  - tracklet_agg
  - team
  - team_side

experiment_name: "gsr"
experiment_subname: "step_3_sam3_concept_valid_021"
home_dir: "${oc.env:HOME}"
data_dir: "${project_dir}/datasets"
model_dir: "${project_dir}/pretrained_models"
num_cores: 16
use_wandb: False
use_rich: True

modules:
  bbox_detector: {batch_size: 1, cfg: {path_to_checkpoint: "${model_dir}/yolo/yolo_v8x6_person_lr_default_best.pt"}}
  pose_bottomup: {batch_size: 1}
  reid:          {batch_size: 32}             # was 16 → 2x throughput
  track:         {batch_size: 1}
  pitch:         {batch_size: 1}
  calibration:   {batch_size: 1}
  apply_camera_params: {batch_size: 1, use_h: False, use_linalg: False}
  legibility:    {batch_size: 64}             # was 16 → 4x throughput
  jersey_and_role:
    batch_size: 16                            # was 8  → 2x Qwen throughput
    cfg:
      model_path: "${model_dir}/jn/Qwen2.5-VL-7B-Instruct"
      save_jersey_number_full_detection: False
      use_legibility_filter: True
      legibility_filter_threshold: 0.5
      downsample_factor: 4
      image_width: 1920
      image_height: 1080
      frame_stride: 5         # run Qwen JN on every 5th frame only (~5x fewer calls)
      skip_role_inference: True  # use PRTReId role, skip Qwen role pass entirely
  concat_tracklets_by_reid: {threshold: 0.1}

test_tracking: True
eval_tracking: False
print_config: False

dataset:
  nvid: -1
  eval_set: "valid"
  dataset_path: ${data_dir}/SoccerNetGS
  vids_dict:
    valid: ["SNGS-021"]

state:
  save_file: "states/sn-gamestate.pklz"
  load_file: "/remote-home/jiayuanrao/yishan/SoccerMaster/experiments/replacement_outputs/sam3_concept_021/sn-gamestate.pklz"

visualization:
  cfg:
    save_videos: False

project_dir: "${hydra:runtime.cwd}"
hydra:
  output_subdir: "configs"
  job:
    chdir: True
  run:
    dir: "outputs/${experiment_name}/${experiment_subname}"
  sweep:
    dir: "multirun_outputs/${experiment_name}/${experiment_subname}"
